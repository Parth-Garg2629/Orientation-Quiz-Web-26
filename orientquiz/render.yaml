services:
  - type: web
    name: orientquiz-server
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSCODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: orientquiz-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: orientquiz-db
    plan: free
    databaseName: orientquiz
    user: orientquiz
