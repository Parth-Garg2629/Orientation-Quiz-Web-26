services:
  - type: web
    name: orientquiz-server
    runtime: docker
    rootDir: orientquiz
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSCODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: orientquiz-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://orientquiz-client.onrender.com"

  - type: web
    name: orientquiz-client
    env: static
    rootDir: orientquiz
    buildCommand: npm install && npm run build --workspace=@orientquiz/shared && npm run build --workspace=client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_SOCKET_URL
        value: https://orientquiz-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: orientquiz-db
    plan: free
    databaseName: orientquiz
    user: orientquiz
